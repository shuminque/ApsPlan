<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>产线管理</title>
    <link rel="stylesheet" href="/static/lib/layui-v2.8.17/css/layui.css" media="all">
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; padding: 16px; }
        .required::after { content: " *"; color: #dc3545; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="card mb-3"><div class="card-body">
        <form id="searchForm" class="row g-3 align-items-end">
            <div class="col-md-3"><label for="lineCode" class="form-label">产线编码</label><input id="lineCode" name="lineCode" type="text" class="form-control" placeholder="请输入产线编码"></div>
            <div class="col-md-3"><label for="lineName" class="form-label">产线名称</label><input id="lineName" name="lineName" type="text" class="form-control" placeholder="请输入产线名称"></div>
            <div class="col-md-6 text-md-end"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-outline-secondary" id="btnReset">重置</button><button type="button" class="btn btn-success" id="btnAdd">新增</button></div>
        </form>
    </div></div>

    <div class="card"><div class="card-body"><table id="lineTable" lay-filter="lineTable"></table></div></div>
</div>

<script type="text/html" id="lineRowBar">
    <button class="btn btn-sm btn-outline-primary me-1" lay-event="edit">编辑</button>
    <button class="btn btn-sm btn-outline-danger me-1" lay-event="del">删除</button>
    <button class="btn btn-sm btn-outline-warning" lay-event="toggle">{{ Number(d.status)===1 ? '停用' : '启用' }}</button>
</script>

<div class="modal fade" id="lineModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="lineModalTitle">新增产线</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><form id="lineForm" novalidate><input type="hidden" id="lineId" name="id"><div class="row g-3">
        <div class="col-md-6"><label for="formLineCode" class="form-label required">产线编码</label><input type="text" id="formLineCode" name="lineCode" class="form-control" required></div>
        <div class="col-md-6"><label for="formLineName" class="form-label required">产线名称</label><input type="text" id="formLineName" name="lineName" class="form-control" required></div>
        <div class="col-md-6"><label for="formWorkshop" class="form-label">车间</label><input type="text" id="formWorkshop" name="workshop" class="form-control"></div>
        <div class="col-md-6"><label for="formStatus" class="form-label">状态</label><select id="formStatus" name="status" class="form-select"><option value="1" selected>启用</option><option value="0">停用</option></select></div>
        <div class="col-12"><label for="formRemark" class="form-label">备注</label><textarea id="formRemark" name="remark" rows="3" class="form-control"></textarea></div>
    </div></form></div>
    <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div>
</div></div></div>

<script src="/static/js/http_code.jquery.com_jquery-3.6.0.min.js"></script>
<script src="/static/lib/layui-v2.8.17/layui.js"></script>
<script src="/static/js/bootstrap@5.1.0_dist_js_bootstrap.bundle.js"></script>
<script>
const lineModal = new bootstrap.Modal(document.getElementById('lineModal')); let currentRecords=[]; let modalMode='add';
function showError(msg){alert(msg)}
function formatDateTime(v){if(!v)return '';const d=new Date(v);if(isNaN(d.getTime()))return v;return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`}
function statusBadge(status){return Number(status)===1?'<span class="layui-badge layui-bg-green">启用</span>':'<span class="layui-badge">停用</span>'}
function handleResponse(res){if(!res||res.code!==200){showError(res?res.msg:'请求失败');return false;}return true;}
function getRowById(id){return currentRecords.find(item=>String(item.id)===String(id));}
function openModal(mode,rowData){modalMode=mode;$('#lineForm')[0].reset();$('#lineId').val('');if(mode==='edit'&&rowData){$('#lineModalTitle').text('编辑产线');$('#lineId').val(rowData.id||'');$('#formLineCode').val(rowData.lineCode||'');$('#formLineName').val(rowData.lineName||'');$('#formWorkshop').val(rowData.workshop||'');$('#formStatus').val(String(rowData.status==null?1:rowData.status));$('#formRemark').val(rowData.remark||'');}else{$('#lineModalTitle').text('新增产线');$('#formStatus').val('1');}lineModal.show();}
function saveLine(renderTable){const form=document.getElementById('lineForm');if(!form.checkValidity())return $('#lineForm').addClass('was-validated');const payload={id:$('#lineId').val()||null,lineCode:$('#formLineCode').val().trim(),lineName:$('#formLineName').val().trim(),workshop:$('#formWorkshop').val().trim(),status:Number($('#formStatus').val()),remark:$('#formRemark').val().trim()};$.ajax({url:modalMode==='add'?'/api/production-line/add':'/api/production-line/update',method:modalMode==='add'?'POST':'PUT',contentType:'application/json',data:JSON.stringify(payload),success:function(res){if(handleResponse(res)){lineModal.hide();renderTable();}}});}

layui.use(['table'], function(){
    const table = layui.table;
    function renderTable(){
        table.render({elem:'#lineTable',url:'/api/production-line/list',method:'GET',request:{pageName:'page',limitName:'size'},where:{lineCode:$('#lineCode').val().trim(),lineName:$('#lineName').val().trim()},
            parseData:function(res){if(!handleResponse(res))return {code:1,msg:'',count:0,data:[]};const data=res.data||{};currentRecords=data.records||[];return {code:0,msg:'',count:Number(data.total||0),data:currentRecords};},
            page:true,limit:20,limits:[20,50,100],toolbar:['filter','exports','print'],
            cols:[ [
                {field:'lineName',title:'产线名称'},
                {field:'workshop',title:'车间'},
                {field:'status',title:'状态',templet:d=>statusBadge(d.status)},
                {field:'remark',title:'备注',hide:true},
                {field:'updateTime',title:'更新时间',templet:d=>formatDateTime(d.updateTime),hide:true},
                {fixed:'right',title:'操作',toolbar:'#lineRowBar',width:230}
            ]]
        });
    }

    renderTable();
    $('#btnSearch').on('click', renderTable);
    $('#btnReset').on('click', function(){ $('#searchForm')[0].reset(); renderTable(); });
    $('#btnAdd').on('click', function(){ openModal('add'); });
    $('#btnSave').on('click', function(){ saveLine(renderTable); });

    table.on('tool(lineTable)', function(obj){
        if(obj.event==='edit'){const row=getRowById(obj.data.id); if(row) openModal('edit', row);} 
        if(obj.event==='del'){ if(!confirm('确定要删除该产线吗？')) return; $.ajax({url:'/api/production-line/delete/'+obj.data.id,method:'DELETE',success:function(res){ if(handleResponse(res)) renderTable(); }}); }
        if(obj.event==='toggle'){ const status=Number(obj.data.status)===1?0:1; $.ajax({url:'/api/production-line/status/'+obj.data.id,method:'PUT',data:{status:status},success:function(res){ if(handleResponse(res)) renderTable(); }}); }
    });
});
</script>
</body>
</html>
