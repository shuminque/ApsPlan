<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>产线系列配置</title>
    <link rel="stylesheet" href="/static/lib/layui-v2.8.17/css/layui.css" media="all">
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #f8f9fa; padding: 16px; }</style>
</head>
<body>
<div class="card mb-3"><div class="card-body"><div class="row g-2 align-items-center">
    <div class="col-md-4"><label class="form-label mb-1">产线</label><select id="lineId" class="form-select"><option value="">全部产线</option></select></div>
    <div class="col-md-4"><label class="form-label mb-1">型号/系列前缀</label><input id="modelKeyword" class="form-control" placeholder="请输入完整型号或系列前缀"></div>
    <div class="col-md-4 d-flex align-items-end gap-2"><button class="btn btn-primary" id="btnSearch">查询</button><button class="btn btn-outline-secondary" id="btnReset">重置</button><button class="btn btn-success ms-auto" id="btnAdd">新增系列</button></div>
</div></div></div>
<div class="card"><div class="card-body"><table id="configTable" lay-filter="configTable"></table></div></div>

<script type="text/html" id="configRowBar">
    <button class="btn btn-sm btn-outline-primary me-1" lay-event="edit">编辑</button>
    <button class="btn btn-sm btn-outline-danger me-1" lay-event="del">删除</button>
<!--    <button class="btn btn-sm btn-outline-warning" lay-event="toggle">{{ Number(d.status)===1 ? '停用' : '启用' }}</button>-->
</script>

<div class="modal fade" id="configModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title" id="modalTitle">新增系列配置</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><form id="configForm" class="needs-validation" novalidate>
            <input type="hidden" id="id" name="id">
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label">产线</label><select id="formLineId" name="lineId" class="form-select" required><option value="">请选择产线</option></select><div class="invalid-feedback">请选择产线</div></div>
                <div class="col-md-6"><label class="form-label">型号/系列前缀</label><input id="formModel" name="model" class="form-control" maxlength="100" required placeholder="支持完整型号或系列前缀，例如 6200"><div class="invalid-feedback">请输入型号或系列前缀</div></div>
                <div class="col-md-3"><label class="form-label">产能(件/小时)</label><input id="formCapacityPerHour" name="capacityPerHour" type="number" step="0.01" min="0" class="form-control" required></div>
                <div class="col-md-3"><label class="form-label">小换型时长(分钟)</label><input id="formSmallChangeoverTime" name="smallChangeoverTime" type="number" min="0" class="form-control" required></div>
                <div class="col-md-3"><label class="form-label">大换型时长(分钟)</label><input id="formLargeChangeoverTime" name="largeChangeoverTime" type="number" min="0" class="form-control" required></div>
                <div class="col-md-3"><label class="form-label">优先级</label><input id="formPriority" name="priority" type="number" min="0" class="form-control" value="0"></div>
                <div class="col-md-4"><label class="form-label">状态</label><select id="formStatus" name="status" class="form-select"><option value="1">启用</option><option value="0">停用</option></select></div>
                <div class="col-md-8"><label class="form-label">备注</label><input id="formRemark" name="remark" class="form-control" maxlength="255" placeholder="可填写型号/系列匹配策略说明"></div>
            </div>
        </form></div>
        <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div>
    </div></div>
</div>

<script src="/static/js/http_code.jquery.com_jquery-3.6.0.min.js"></script>
<script src="/static/lib/layui-v2.8.17/layui.js"></script>
<script src="/static/js/bootstrap@5.1.0_dist_js_bootstrap.bundle.js"></script>
<script>
const modal = new bootstrap.Modal(document.getElementById('configModal')); let modalMode='add'; let currentRecords=[];
function safeText(v){return v==null?'':String(v)}
function formatDateTime(v){if(!v)return '';const d=new Date(v);if(isNaN(d.getTime()))return v;return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`}
function showMessage(msg){alert(msg)}
function loadLineOptions(){return $.ajax({url:'/api/model-config/line-options',method:'GET',success:function(res){if(!res||res.code!==200)return showMessage(res?res.msg:'加载产线失败');
    const options=(res.data||[])
        // .map(i=>`<option value="${i.id}">${safeText(i.lineCode)} - ${safeText(i.lineName)}</option>`)
        .map(i=>`<option value="${i.id}"> ${safeText(i.lineName)}</option>`)
        .join('');$('#lineId')
            .append(options);$('#formLineId')
            .append(options);}})}
function getRowById(id){return currentRecords.find(item=>String(item.id)===String(id))}
function openModal(mode,row){modalMode=mode;$('#configForm')[0].reset();$('#id').val('');if(mode==='edit'&&row){$('#modalTitle').text('编辑系列配置');$('#id').val(row.id||'');$('#formLineId').val(String(row.lineId||''));$('#formModel').val(row.model||'');$('#formCapacityPerHour').val(row.capacityPerHour);$('#formSmallChangeoverTime').val(row.smallChangeoverTime);$('#formLargeChangeoverTime').val(row.largeChangeoverTime);$('#formPriority').val(row.priority==null?0:row.priority);$('#formStatus').val(String(row.status==null?1:row.status));$('#formRemark').val(row.remark||'');}else{$('#modalTitle').text('新增系列配置');$('#formStatus').val('1');$('#formPriority').val('0');}modal.show();}
function collectFormData(){return {id:$('#id').val()||null,lineId:Number($('#formLineId').val()),model:$('#formModel').val().trim(),capacityPerHour:Number($('#formCapacityPerHour').val()),smallChangeoverTime:Number($('#formSmallChangeoverTime').val()),largeChangeoverTime:Number($('#formLargeChangeoverTime').val()),priority:Number($('#formPriority').val()||0),status:Number($('#formStatus').val()),remark:$('#formRemark').val().trim()}}
function saveConfig(renderTable){const f=document.getElementById('configForm');if(!f.checkValidity())return $('#configForm').addClass('was-validated');$.ajax({url:modalMode==='add'?'/api/model-config/add':'/api/model-config/update',method:modalMode==='add'?'POST':'PUT',contentType:'application/json',data:JSON.stringify(collectFormData()),success:function(res){if(!res||res.code!==200)return showMessage(res?res.msg:'保存失败');modal.hide();renderTable();},error:function(){showMessage('保存失败');}})}
function deleteConfig(id,renderTable){if(!confirm('确认删除该记录吗？'))return;$.ajax({url:'/api/model-config/delete/'+id,method:'DELETE',success:function(res){if(!res||res.code!==200)return showMessage(res?res.msg:'删除失败');renderTable();}})}
function toggleStatus(id,status,renderTable){$.ajax({url:'/api/model-config/status/'+id,method:'PUT',data:{status:status},success:function(res){if(!res||res.code!==200)return showMessage(res?res.msg:'状态更新失败');renderTable();}})}

layui.use(['table'], function(){
    const table = layui.table;
    function renderTable(){
        table.render({elem:'#configTable',url:'/api/model-config/list',method:'GET',request:{pageName:'page',limitName:'size'},where:{lineId:$('#lineId').val(),model:$('#modelKeyword').val().trim()},
            parseData:function(res){if(!res||res.code!==200)return {code:1,msg:res?res.msg:'查询失败',count:0,data:[]};const d=res.data||{};currentRecords=d.records||[];return {code:0,msg:'',count:Number(d.total||0),data:currentRecords};},
            page:true,limit:20,limits:[20,50,100],toolbar:['filter','exports','print'],
            cols:[ [
                {field:'lineName',title:'产线'}, {field:'model',title:'系列'},
                {field:'capacityPerHour',title:'产能(件/小时)'},
                {field:'smallChangeoverTime',title:'小换型时长(分钟)'},
                {field:'largeChangeoverTime',title:'大换型时长(分钟)'},
                {field:'priority',title:'优先级'},
                {field:'status',title:'状态',templet:d=>Number(d.status)===1?'<span class="layui-badge layui-bg-green">启用</span>':'<span class="layui-badge">停用</span>'},
                {field:'remark',title:'备注',hide:true},
                {field:'updateTime',title:'更新时间',templet:d=>formatDateTime(d.updateTime),hide:true},
                {fixed:'right',title:'操作',toolbar:'#configRowBar',width:230}
            ]]
        });
    }
    loadLineOptions().then(renderTable);
    $('#btnSearch').on('click', renderTable); $('#btnReset').on('click', function(){ $('#lineId').val(''); $('#modelKeyword').val(''); renderTable(); });
    $('#btnAdd').on('click', function(){openModal('add');}); $('#btnSave').on('click', function(){saveConfig(renderTable);});
    table.on('tool(configTable)', function(obj){ if(obj.event==='edit'){const row=getRowById(obj.data.id);if(row)openModal('edit',row);} if(obj.event==='del'){deleteConfig(obj.data.id,renderTable);} if(obj.event==='toggle'){toggleStatus(obj.data.id, Number(obj.data.status)===1?0:1, renderTable);} });
});
</script>
</body>
</html>
