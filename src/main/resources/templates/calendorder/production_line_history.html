<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>生产履历查询</title>
    <link rel="stylesheet" href="/static/lib/layui-v2.8.17/css/layui.css" media="all">
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #f8f9fa; padding: 16px; }</style>
</head>
<body>
<div class="card mb-3"><div class="card-body"><div class="row g-2 align-items-end">
    <div class="col-md-3"><label class="form-label">产线</label><select id="lineId" class="form-select"><option value="">全部产线</option></select></div>
    <div class="col-md-2"><label class="form-label">事件类型</label><select id="eventType" class="form-select"><option value="">全部类型</option><option value="1">生产</option><option value="2">换型</option><option value="3">停机</option><option value="4">维护</option></select></div>
    <div class="col-md-3"><label class="form-label">开始时间</label><input id="startTime" type="datetime-local" class="form-control"></div>
    <div class="col-md-3"><label class="form-label">结束时间</label><input id="endTime" type="datetime-local" class="form-control"></div>
    <div class="col-md-1 d-grid gap-2"><button class="btn btn-primary" id="btnSearch">查询</button></div>
    <div class="col-12"><button class="btn btn-outline-secondary" id="btnReset">重置</button></div>
</div></div></div>

<div class="card"><div class="card-body"><table id="historyTable" lay-filter="historyTable"></table></div></div>

<script src="/static/js/http_code.jquery.com_jquery-3.6.0.min.js"></script>
<script src="/static/lib/layui-v2.8.17/layui.js"></script>
<script>
    function safeText(v){return v==null?'':String(v)}
    function formatDateTime(v){if(!v)return '';const d=new Date(v);if(isNaN(d.getTime()))return v;return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`}
    function toQueryDateTime(v){return v? v.replace('T',' ') + ':00' : ''}
    function eventTypeText(type){return {1:'生产',2:'换型',3:'停机',4:'维护'}[Number(type)] || ('类型'+safeText(type))}
    function loadLineOptions(){return $.ajax({url:'/api/model-config/line-options',method:'GET',success:function(res){if(!res||res.code!==200)return;$('#lineId').append((res.data||[]).map(l=>`<option value="${l.id}">${safeText(l.lineCode)} - ${safeText(l.lineName)}</option>`).join(''));}})}

    layui.use(['table'], function(){
        const table = layui.table;
        function renderTable(){
            table.render({
                elem:'#historyTable', url:'/api/history/list', method:'GET',
                request:{pageName:'page',limitName:'size'},
                where:{ lineId: $('#lineId').val() || null, eventType: $('#eventType').val() || null, startTime: toQueryDateTime($('#startTime').val()), endTime: toQueryDateTime($('#endTime').val()) },
                parseData:function(res){
                    if(!res||res.code!==200){ return {code:1,msg:res?res.msg:'查询失败',count:0,data:[]}; }
                    const d = res.data || {}; return {code:0,msg:'',count:Number(d.total||0),data:d.records||[]};
                },
                page:true, limit:20, limits:[20,50,100], toolbar:['filter','exports','print'],
                cols:[ [
                    {field:'lineCode', title:'产线编码'},
                    {field:'lineName', title:'产线名称'},
                    {field:'model', title:'型号'},
                    {field:'eventType', title:'事件类型', templet:d=>eventTypeText(d.eventType)},
                    {field:'startTime', title:'开始时间', templet:d=>formatDateTime(d.startTime)},
                    {field:'endTime', title:'结束时间', templet:d=>formatDateTime(d.endTime)},
                    {field:'durationMinutes', title:'持续时长(分钟)'},
                    {field:'remark', title:'备注'},
                    {field:'createTime', title:'创建时间', templet:d=>formatDateTime(d.createTime)}
                ]]
            });
        }
        loadLineOptions().then(renderTable);
        $('#btnSearch').on('click', renderTable);
        $('#btnReset').on('click', function(){ $('#lineId').val(''); $('#eventType').val(''); $('#startTime').val(''); $('#endTime').val(''); renderTable(); });
    });
</script>
</body>
</html>
