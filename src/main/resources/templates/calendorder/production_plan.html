<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>计划批次列表</title>
    <link rel="stylesheet" href="/static/lib/layui-v2.8.17/css/layui.css" media="all">
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#f8f9fa;padding:16px;}</style>
</head>
<body>
<div class="card mb-3"><div class="card-body"><div class="row g-2 align-items-end">
    <div class="col-md-3"><input id="batch" class="form-control" placeholder="批次号"></div>
    <div class="col-md-2"><input id="source" class="form-control" placeholder="来源"></div>
    <div class="col-md-2"><select id="lineId" class="form-select"><option value="">全部产线</option></select></div>
    <div class="col-md-2"><input id="startTime" type="date" class="form-control"></div>
    <div class="col-md-2"><input id="endTime" type="date" class="form-control"></div>
    <div class="col-md-1 d-flex gap-2"><button class="btn btn-primary" id="btnSearch">查</button></div>
</div></div></div>
<div class="card"><div class="card-body"><table id="planTable" lay-filter="planTable"></table></div></div>

<script type="text/html" id="rowBar">
    <button class="btn btn-sm btn-outline-primary" lay-event="items">查看明细</button>
</script>

<div class="modal fade" id="itemsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">批次明细</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body"><table id="itemTable" lay-filter="itemTable"></table></div>
        </div>
    </div>
</div>

<script src="/static/js/http_code.jquery.com_jquery-3.6.0.min.js"></script>
<script src="/static/lib/layui-v2.8.17/layui.js"></script>
<script src="/static/js/bootstrap@5.1.0_dist_js_bootstrap.bundle.js"></script>
<script>
    const modal = new bootstrap.Modal(document.getElementById('itemsModal'));
    function f(v){ if(!v) return ''; const d = new Date(v); if (isNaN(d.getTime())) return v; return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
    layui.use(['table'], function(){
        const table = layui.table;
        function loadLines(){ return $.get('/api/model-config/line-options', function(res){ if(res&&res.code===200){ (res.data||[]).forEach(v=>$('#lineId').append(`<option value="${v.id}">${v.lineName}</option>`)); } }); }
        function renderPlans(){
            table.render({
                elem:'#planTable',url:'/api/production-plan/list',method:'get',
                where:{batch:$('#batch').val(),source:$('#source').val(),lineId:$('#lineId').val()||null,startTime:$('#startTime').val(),endTime:$('#endTime').val()},
                request:{pageName:'page',limitName:'size'},limit:20,page:true,
                parseData:res=>({code:0,msg:'',count:res.data.total,data:res.data.records}),
                cols:[[ 
                    {field:'id',title:'ID',width:80},
                    {field:'planBatchNo',title:'批次号'},
                    {field:'source',title:'来源'},
                    {field:'startDate',title:'开始时间',templet:d=>f(d.startDate)},
                    {field:'endDate',title:'结束时间',templet:d=>f(d.endDate)},
                    {field:'totalAssignQty',title:'总分配量'},
                    {field:'createdAt',title:'创建时间',templet:d=>f(d.createdAt)},
                    {title:'操作',toolbar:'#rowBar',width:120}
                ]]
            });
        }
        function openItems(planId){
            table.render({elem:'#itemTable',data:[],cols:[[]]});
            $.get(`/api/production-plan/${planId}/items`, function(res){
                const list = (res&&res.code===200)?(res.data||[]):[];
                table.render({elem:'#itemTable',data:list,limit:50,page:true,cols:[[ 
                    {field:'id',title:'ID',width:80},{field:'lineName',title:'产线'},{field:'customer',title:'客户'},
                    {field:'model',title:'型号'},{field:'outerInnerRing',title:'内外轮'},{field:'assignQty',title:'总量'},
                    {field:'orderDemandQty',title:'订单量'},{field:'safetyDemandQty',title:'安全库存量'},
                    {field:'startDate',title:'开始',templet:d=>f(d.startDate)},{field:'endDate',title:'结束',templet:d=>f(d.endDate)}
                ]]});
                modal.show();
            });
        }
        table.on('tool(planTable)', function(obj){ if(obj.event==='items') openItems(obj.data.id); });
        $('#btnSearch').on('click',renderPlans);
        loadLines().then(renderPlans);
    });
</script>
</body>
</html>
