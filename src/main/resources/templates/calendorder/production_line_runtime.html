<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>产线运行状态</title>
    <link rel="stylesheet" href="/static/lib/layui-v2.8.17/css/layui.css" media="all">
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; padding: 16px; }
    </style>
</head>
<body>
<div class="card mb-3">
    <div class="card-body">
        <div class="row g-2 align-items-end">
            <div class="col-md-4">
                <label class="form-label">产线</label>
                <select id="lineId" class="form-select">
                    <option value="">全部产线</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">状态</label>
                <select id="status" class="form-select">
                    <option value="">全部状态</option>
                    <option value="0">待机</option>
                    <option value="1">生产中</option>
                </select>
            </div>
            <div class="col-md-4 d-flex gap-2">
                <button class="btn btn-primary" id="btnSearch">查询</button>
                <button class="btn btn-outline-secondary" id="btnReset">重置</button>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <table id="runtimeTable" lay-filter="runtimeTable"></table>
    </div>
</div>

<script type="text/html" id="runtimeRowBar">
    <button class="btn btn-sm btn-outline-primary" lay-event="edit">编辑</button>
</script>

<div class="modal fade" id="runtimeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">编辑运行状态</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="runtimeForm" class="needs-validation" novalidate>
                    <input type="hidden" id="id">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">产线</label>
                            <select id="formLineId" class="form-select" required>
                                <option value="">请选择产线</option>
                            </select>
                            <div class="invalid-feedback">请选择产线</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">状态</label>
                            <select id="formStatus" class="form-select" required>
                                <option value="0">待机</option>
                                <option value="1">生产中</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">当前型号</label>
                            <input id="formCurrentModel" class="form-control" maxlength="100">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">当前产能</label>
                            <input id="formCurrentCapacity" type="number" step="0.01" min="0" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">换型开始时间</label>
                            <input id="formChangeoverStartTime" type="datetime-local" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">换型结束时间</label>
                            <input id="formChangeoverEndTime" type="datetime-local" class="form-control">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="btnSave">保存</button>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/http_code.jquery.com_jquery-3.6.0.min.js"></script>
<script src="/static/lib/layui-v2.8.17/layui.js"></script>
<script src="/static/js/bootstrap@5.1.0_dist_js_bootstrap.bundle.js"></script>
<script>
    const modal = new bootstrap.Modal(document.getElementById('runtimeModal'));
    let lineOptions = [];
    let records = [];
    let tableIns;
    let layTable;

    function safeText(v) { return v == null ? '' : String(v); }
    function formatDate(v) {
        if (!v) return '';
        const d = new Date(v);
        if (isNaN(d.getTime())) return v;
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
    }
    function toInputDatetime(v) {
        if (!v) return '';
        const d = new Date(v);
        if (isNaN(d.getTime())) return '';
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }
    function fromInputDatetime(v) { return v ? v.replace('T', ' ') + ':00' : null; }
    function statusText(status) {
        if (Number(status) === 1) return '<span class="layui-badge layui-bg-green">生产中</span>';
        return '<span class="layui-badge">待机</span>';
    }

    function renderTable() {
        tableIns = layTable.render({
            elem: '#runtimeTable',
            data: records,
            page: true,
            limit: 20,
            limits: [20, 50, 100],
            toolbar: ['filter', 'exports', 'print'],
            cols: [ [
                {field: 'lineCode', title: '产线编码', hide: true},
                {field: 'lineName', title: '产线名称'},
                {field: 'currentModel', title: '当前型号'},
                {field: 'currentCapacity', title: '当前产能'},
                {field: 'status', title: '状态', templet: d => statusText(d.status)},
                {field: 'changeoverStartTime', title: '换型开始时间', templet: d => formatDate(d.changeoverStartTime)},
                {field: 'changeoverEndTime', title: '换型结束时间', templet: d => formatDate(d.changeoverEndTime)},
                {field: 'updateTime', title: '更新时间', templet: d => formatDate(d.updateTime)},
                {fixed: 'right', title: '操作', toolbar: '#runtimeRowBar', width: 100}
            ]]
        });
    }

    function loadLineOptions() {
        return $.ajax({ url: '/api/model-config/line-options', method: 'GET', success: function (res) {
            if (!res || res.code !== 200) return;
            lineOptions = res.data || [];
            const options = lineOptions.map(l => `<option value="${l.id}">${safeText(l.lineCode)} - ${safeText(l.lineName)}</option>`).join('');
            $('#lineId').append(options); $('#formLineId').append(options);
        }});
    }

    function loadList() {
        const status = $('#status').val();
        $.ajax({
            url: '/api/runtime/list', method: 'GET', data: { lineId: $('#lineId').val() || null, status: status === '' ? null : Number(status) },
            success: function (res) {
                if (!res || res.code !== 200) return alert(res ? res.msg : '加载失败');
                records = res.data || [];
                renderTable();
            }, error: function () { alert('加载失败'); }
        });
    }

    function openEdit(id) {
        const row = records.find(v => String(v.id) === String(id)); if (!row) return;
        $('#runtimeForm')[0].reset(); $('#runtimeForm').removeClass('was-validated');
        $('#id').val(row.id || ''); $('#formLineId').val(String(row.lineId || ''));
        $('#formCurrentModel').val(row.currentModel || ''); $('#formCurrentCapacity').val(row.currentCapacity == null ? '' : row.currentCapacity);
        $('#formStatus').val(String(row.status == null ? 1 : row.status));
        $('#formChangeoverStartTime').val(toInputDatetime(row.changeoverStartTime)); $('#formChangeoverEndTime').val(toInputDatetime(row.changeoverEndTime));
        modal.show();
    }

    function save() {
        const formEl = document.getElementById('runtimeForm');
        if (!formEl.checkValidity()) return $('#runtimeForm').addClass('was-validated');
        const payload = { id: Number($('#id').val()), lineId: Number($('#formLineId').val()), currentModel: $('#formCurrentModel').val().trim() || null,
            currentCapacity: $('#formCurrentCapacity').val() ? Number($('#formCurrentCapacity').val()) : null, status: Number($('#formStatus').val()),
            changeoverStartTime: fromInputDatetime($('#formChangeoverStartTime').val()), changeoverEndTime: fromInputDatetime($('#formChangeoverEndTime').val()) };
        $.ajax({ url: '/api/runtime/update', method: 'PUT', contentType: 'application/json', data: JSON.stringify(payload),
            success: function (res) { if (!res || res.code !== 200) return alert(res ? res.msg : '保存失败'); modal.hide(); loadList(); },
            error: function () { alert('保存失败'); }
        });
    }

    layui.use(['table'], function () {
        layTable = layui.table;
        loadLineOptions().then(loadList);
        layTable.on('tool(runtimeTable)', function (obj) { if (obj.event === 'edit') openEdit(obj.data.id); });
        $('#btnSearch').on('click', loadList);
        $('#btnReset').on('click', function () { $('#lineId').val(''); $('#status').val(''); loadList(); });
        $('#btnSave').on('click', save);
    });
</script>
</body>
</html>
