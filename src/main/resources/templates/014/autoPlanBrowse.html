<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>自动排产</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/lib/layui-v2.8.17/css/layui.css" media="all">
</head>
<body>
<div class="layui-fluid" style="padding: 14px;">
    <div class="layui-card">
        <div class="layui-card-body">
            <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
                <div style="display: none">
                    <label>浏览开始日期</label>
                    <input id="planStart" type="date" class="layui-input" style="width:180px;">
                </div>
                <div style="display: none">
                    <label>浏览结束日期</label>
                    <input id="planEnd" type="date" class="layui-input" style="width:180px;">
                </div>
                <a id="retryAutoPreviewLink"
                   href="javascript:void(0);"
                   style="display:none;color:#1E9FFF;text-decoration:underline;"
                   onclick="retryAutoPlanPreview()">自动加载失败，重新加载待排订单</a>
                <!--                <button class="layui-btn layui-btn-primary" onclick="window.location.href='/calendar'">返回生产日历</button>-->
            </div>
            <!--            <div style="margin-top:8px;color:#666;">已自动加载待排订单，请确认开始时间后继续排产。</div>-->
        </div>
    </div>
</div>

<script src="/static/lib/layui-v2.8.17/layui.js" charset="utf-8"></script>
<script>
    let previewPlanData = null;
    let planBrowseData = null;
    let planOrderStartMap = {};
    let selectedInsertLineIdsForCommit = [];
    let insertSelectionConfirmedForPreview = false;
    let insertDelayConfirmedForPreview = false;
    let autoPreviewTriggered = false;
    let selectedInsertLineIdsForPreview = [];
    let orderStartTimesForPreview = {};

    function toDateValue(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function buildPlanOrderKey(order) {
        if (!order) return '';
        return [order.customer || '', order.outerInnerRing || '', order.model || ''].join('||');
    }

    function escapeHtml(raw) {
        if (raw === null || raw === undefined) return '';
        return String(raw)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function getCurrentRange() {
        const start = (document.getElementById('planStart') || {}).value || '';
        const end = (document.getElementById('planEnd') || {}).value || '';
        return {start, end};
    }

    function requestAutoPlanBrowseData() {
        const range = getCurrentRange();
        if (!range.start || !range.end) {
            layer.msg('请先选择浏览开始/结束日期');
            return Promise.reject(new Error('日期范围缺失'));
        }

        return fetch('/api/shift/plan/preview', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                start: range.start,
                end: range.end
            })
        })
            .then(res => {
                if (!res.ok) throw new Error('预览失败');
                return res.json();
            })
            .then(data => {
                planBrowseData = data || {events: [], orders: [], dailyOutputs: []};
                const orders = planBrowseData.orders || [];
                const nextMap = {};
                orders.forEach(item => {
                    const key = buildPlanOrderKey(item);
                    if (!nextMap[key]) {
                        nextMap[key] = planOrderStartMap[key] || range.start;
                    }
                });
                planOrderStartMap = nextMap;
                return planBrowseData;
            });
    }

    function openPlanBrowseDialog(data) {
        const orders = data.orders || [];
        const orderRows = orders.map(item => {
            const key = buildPlanOrderKey(item);
            const startValue = planOrderStartMap[key] || '';
            const orderIds = Array.isArray(item.orderIds) ? item.orderIds.filter(id => id !== null && id !== undefined && id !== '') : [];
            return `
            <tr data-order-key="${escapeHtml(key)}" data-order-ids="${escapeHtml(JSON.stringify(orderIds))}">
                <td>${item.customer || ''}</td>
                <td>${item.outerInnerRing || ''}</td>
                <td>${item.model || ''}</td>
                <td>${item.earliestDeliveryDate || ''}</td>
                <td>${item.currentInventory || 0}</td>
                <td>${item.orderCount || 0}</td>
                <td>${item.safetyStockQuantity || 0}</td>
                <td>${item.plannedQuantity || item.requiredQuantity || 0}</td>
                <td><input type="date" class="layui-input plan-order-start-input" value="${escapeHtml(startValue)}"></td>
            </tr>
            `;
        }).join('');

        layer.open({
            type: 1,
            title: '自动排产 - 浏览分解',
            area: ['100%', '80%'],
            maxmin: true,
            btn: ['排产', '关闭'],
            content: `
                <div style="padding: 12px; max-height: 650px; overflow: auto;">
                    <div style="margin-bottom: 8px; color: #666;">已自动加载待排订单，请确认开始时间后继续排产。</div>
                    <div style="margin-bottom: 8px; font-weight: 700;">待排产订单汇总</div>
                    <table class="layui-table">
                        <thead>
                            <tr>
                                <th>客户</th><th>内外圈</th><th>型号</th><th>最早交期</th><th>在库数量</th><th>订单需求数</th><th>安全库存数</th><th>计划排产数</th><th>开始时间</th>
                            </tr>
                        </thead>
                        <tbody>${orderRows || '<tr><td colspan="9" style="text-align:center;color:#999;">无可排产需求</td></tr>'}</tbody>
                    </table>
                </div>
            `,
            yes: function(index) {
                const startRows = document.querySelectorAll('tr[data-order-key]');
                const orderStartTimes = {};
                let invalid = false;
                startRows.forEach(row => {
                    const key = row.getAttribute('data-order-key') || '';
                    const rawOrderIds = row.getAttribute('data-order-ids') || '[]';
                    const start = (row.querySelector('.plan-order-start-input') || {}).value || '';
                    if (!start) {
                        invalid = true;
                        return;
                    }
                    planOrderStartMap[key] = start;
                    try {
                        const orderIds = JSON.parse(rawOrderIds);
                        if (Array.isArray(orderIds)) {
                            orderIds.forEach(orderId => {
                                if (orderId !== null && orderId !== undefined && orderId !== '') {
                                    orderStartTimes[String(orderId)] = start;
                                }
                            });
                        }
                    } catch (e) {
                        // ignore
                    }
                });

                if (invalid) {
                    layer.msg('请为每条订单汇总填写开始时间');
                    return;
                }
                layer.close(index);
                orderStartTimesForPreview = Object.assign({}, orderStartTimes);
                requestAutoPlanPreviewByOrderStart(orderStartTimes);
            }
        });
    }

    function toggleRetryEntry(visible) {
        const retryLink = document.getElementById('retryAutoPreviewLink');
        if (!retryLink) return;
        retryLink.style.display = visible ? 'inline' : 'none';
    }

    function previewAutoPlan(options) {
        const opts = options || {};
        const force = !!opts.force;
        if (autoPreviewTriggered && !force) return;
        if (!force) {
            autoPreviewTriggered = true;
        }
        requestAutoPlanBrowseData()
            .then(data => {
                toggleRetryEntry(false);
                openPlanBrowseDialog(data);
            })
            .catch(() => {
                layer.msg('自动排产浏览数据加载失败');
                toggleRetryEntry(true);
            });
    }

    function retryAutoPlanPreview() {
        previewAutoPlan({force: true});
    }

    function requestAutoPlanPreviewByOrderStart(orderStartTimes, selectedInsertLineIds) {
        const range = getCurrentRange();
        const startList = Object.values(orderStartTimes || {}).filter(Boolean).sort();
        const fallbackStart = startList.length ? startList[0] : range.start;
        const selectedIds = Array.isArray(selectedInsertLineIds) ? selectedInsertLineIds : [];

        fetch('/api/shift/plan/preview', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                start: fallbackStart,
                end: range.end,
                orderStartTimes: orderStartTimes,
                selectedInsertLineIds: selectedIds
            })
        })
            .then(res => {
                if (!res.ok) throw new Error('预览失败');
                return res.json();
            })
            .then(data => {
                previewPlanData = data || {events: [], orders: [], dailyOutputs: []};
                selectedInsertLineIdsForCommit = selectedIds.slice();
                selectedInsertLineIdsForPreview = selectedIds.slice();
                insertSelectionConfirmedForPreview = selectedIds.length > 0;
                insertDelayConfirmedForPreview = !isInsertDelayRequired(previewPlanData);
                if (isAutoInsertTriggered(previewPlanData)) {
                    const insertSuggestion = previewPlanData && previewPlanData.insertSuggestion ? previewPlanData.insertSuggestion : {};
                    const requiredInsertLineCount = Number((previewPlanData && previewPlanData.requiredInsertLineCount) || insertSuggestion.requiredInsertLineCount || 0);
                    if (selectedIds.length < requiredInsertLineCount) {
                        openAutoInsertTriggerDialog(previewPlanData, function (confirmedLineIds) {
                            requestAutoPlanPreviewByOrderStart(orderStartTimesForPreview, confirmedLineIds);
                        });
                        return;
                    }
                }
                openPlanPreviewDialog(previewPlanData);
            })
            .catch(() => layer.msg('自动排产预览失败'));
    }

    function isAutoInsertTriggered(data) {
        return !!(data && data.autoInsertTriggered);
    }

    function isInsertDelayRequired(data) {
        return !!(data && data.insertDelayRequired);
    }

    function formatMetricValue(value) {
        if (value === null || value === undefined || value === '') return '-';
        const num = Number(value);
        if (!Number.isFinite(num)) return '-';
        return num.toFixed(2);
    }

    function formatRangeDate(dateTime) {
        if (!dateTime) return '';
        return dateTime.slice(0, 10);
    }

    function resolvePlanRangeText(data, events) {
        const planStart = data && data.planStart ? String(data.planStart) : '';
        const planEnd = data && data.planEnd ? String(data.planEnd) : '';
        if (planStart && planEnd) return `${planStart} ~ ${planEnd}`;
        if (planStart) return planStart;
        if (planEnd) return planEnd;
        if (!events || !events.length) return '';
        const starts = events.map(item => item && item.start).filter(Boolean).sort();
        const ends = events.map(item => item && item.end).filter(Boolean).sort();
        const fallbackStart = starts.length ? starts[0] : '';
        const fallbackEnd = ends.length ? ends[ends.length - 1] : '';
        if (fallbackStart && fallbackEnd) return `${fallbackStart} ~ ${fallbackEnd}`;
        return fallbackStart || fallbackEnd;
    }

    function openPlanPreviewDialog(data) {
        const orders = data.orders || [];
        const events = data.events || [];
        const planRangeText = resolvePlanRangeText(data, events);

        const orderRows = orders.map(item => `
            <tr>
                <td>${item.customer || ''}</td>
                <td>${item.outerInnerRing || ''}</td>
                <td>${item.model || ''}</td>
                <td>${item.earliestDeliveryDate || ''}</td>
                <td>${item.currentInventory || 0}</td>
                <td>${item.orderCount || 0}</td>
                <td>${item.safetyStockQuantity || 0}</td>
                <td>${item.plannedQuantity || item.requiredQuantity || 0}</td>
            </tr>
        `).join('');

        const resultRows = events.map(event => {
            const diagnosticTag = event.metricDiagnosticTag || '';
            const diagnosticNote = diagnosticTag && diagnosticTag !== 'OK' ? `（${diagnosticTag}）` : '';
            const plannedDays = Number(event.plannedDays || 0);
            return `
                <tr>
                    <td>${event.lineName || ''}</td>
                    <td>${event.customer || ''}</td>
                    <td>${event.outerInnerRing || ''}</td>
                    <td>${event.model || ''}</td>
                    <td>${formatRangeDate(event.start)} ~ ${formatRangeDate(event.end)}</td>
                    <td>${plannedDays > 0 ? plannedDays : '-'}</td>
                    <td>${formatMetricValue(event.dailyOutput)}${diagnosticNote}</td>
                    <td>${formatMetricValue(event.avgDailyWorkHours)}</td>
                    <td>${formatMetricValue(event.capacityPerHour)}</td>
                    <td>${event.quantity || 0}</td>
                </tr>
            `;
        }).join('');

        const selectedLineHint = Array.isArray(selectedInsertLineIdsForPreview) && selectedInsertLineIdsForPreview.length
            ? '预览结果（已应用选线）'
            : '预览结果（未应用选线）';
        layer.open({
            type: 1,
            title: '自动排产结果预览',
            area: ['100%', '80%'],
            maxmin: true,
            btn: ['写入排产', '关闭'],
            content: `
                <div style="padding: 12px; max-height: 650px; overflow: auto;">
                    <div style="margin-bottom: 8px; color: #666;">计划起止：${planRangeText || '-'}</div>
                    <div style="margin-bottom: 8px; color: #666;">${selectedLineHint}；“写入排产”后才会提交生效。</div>
                    <div style="margin-bottom: 8px; font-weight: 700;">待排产订单汇总</div>
                    <table class="layui-table">
                        <thead>
                            <tr>
                                <th>客户</th><th>内外圈</th><th>型号</th><th>最早交期</th><th>在库数量</th><th>订单需求数</th><th>安全库存数</th><th>计划排产数</th>
                            </tr>
                        </thead>
                        <tbody>${orderRows || '<tr><td colspan="8" style="text-align:center;color:#999;">无可排产需求</td></tr>'}</tbody>
                    </table>

                    <div style="margin: 14px 0 8px; font-weight: 700;">排产结果</div>
                    <table class="layui-table">
                        <thead>
                            <tr>
                                <th>产线</th><th>客户</th><th>内外圈</th><th>型号</th><th>排产时间范围</th><th>天数</th><th>日产量</th><th>日均工时</th><th>产能(件/小时)</th><th>总产量</th>
                            </tr>
                        </thead>
                        <tbody>${resultRows || '<tr><td colspan="10" style="text-align:center;color:#999;">暂无排产结果</td></tr>'}</tbody>
                    </table>
                </div>
            `,
            yes: function(index) {
                handleCommitWithInsertSuggestion(data, function () {
                    layer.confirm('确认将当前排产结果写入班次排班吗？', {icon: 3, title: '确认写入'}, function(confirmIndex){
                        commitAutoPlan();
                        layer.close(confirmIndex);
                        layer.close(index);
                    });
                });
            }
        });
    }

    function handleCommitWithInsertSuggestion(data, onReadyToCommit) {
        const insertSuggestion = data && data.insertSuggestion ? data.insertSuggestion : {};
        const requiredInsertLineCount = Number((data && data.requiredInsertLineCount) || insertSuggestion.requiredInsertLineCount || 0);
        const insertDelayRequired = isInsertDelayRequired(data);
        const insertShortageQuantity = Number((data && data.insertShortageQuantity) || 0);
        const suggestedDelayedDays = Number((data && data.suggestedDelayedDays) || 0);
        if (isAutoInsertTriggered(data)) {
            if (insertSelectionConfirmedForPreview
                && Array.isArray(selectedInsertLineIdsForCommit)
                && selectedInsertLineIdsForCommit.length >= requiredInsertLineCount) {
                if (insertDelayRequired && !insertDelayConfirmedForPreview) {
                    const delayedDaysText = suggestedDelayedDays > 0 ? `（建议延期 ${suggestedDelayedDays} 天）` : '';
                    layer.confirm(
                        `推荐总产线仍不足，插单交货期需要延迟。当前缺口数量：${insertShortageQuantity} 件${delayedDaysText}。是否确认延期后继续写入？`,
                        {icon: 0, title: '延期确认', btn: ['确认延期并继续', '取消']},
                        function (confirmIndex) {
                            insertDelayConfirmedForPreview = true;
                            layer.close(confirmIndex);
                            onReadyToCommit();
                        }
                    );
                    return;
                }
                onReadyToCommit();
                return;
            }
            layer.msg('请先确认插单信息并选择插单产线后再提交');
            openAutoInsertTriggerDialog(data, onReadyToCommit);
            return;
        }
        selectedInsertLineIdsForCommit = [];
        selectedInsertLineIdsForPreview = [];
        insertSelectionConfirmedForPreview = false;
        insertDelayConfirmedForPreview = false;
        onReadyToCommit();
    }

    function openAutoInsertTriggerDialog(data, onConfirmThen, onCancelThen) {
        const insertSuggestion = data && data.insertSuggestion ? data.insertSuggestion : {};
        const requiredInsertLineCount = Number((data && data.requiredInsertLineCount) || insertSuggestion.requiredInsertLineCount || 0);
        const candidateLines = Array.isArray(insertSuggestion.candidateLines) ? insertSuggestion.candidateLines : [];
        const requiredInsertQuantity = Number((data && data.requiredInsertQuantity) || 0);
        const insertShortageQuantity = Number((data && data.insertShortageQuantity) || 0);
        const insertDeadline = (data && data.insertDeadline) ? String(data.insertDeadline) : '-';
        const insertDelayRequired = isInsertDelayRequired(data);
        if (!candidateLines.length) {
            layer.msg('已触发插单，但暂无推荐产线，请人工处理后再提交');
            return;
        }
        if (insertDelayRequired) {
            layer.alert(`推荐总产线仍不足，插单交货期需要延迟。当前缺口数量：${insertShortageQuantity} 件。`, {
                icon: 0,
                title: '延期提示'
            });
        }
        layer.msg('检测到插单需求，请先确认插单产线');
        openInsertLineRecommendationDialog(candidateLines, requiredInsertLineCount, function (selectedLineIds) {
            if (typeof onConfirmThen === 'function') {
                onConfirmThen(selectedLineIds);
            }
        }, function () {
            if (typeof onCancelThen === 'function') {
                onCancelThen();
            }
        }, {
            requiredInsertQuantity: requiredInsertQuantity,
            insertDeadline: insertDeadline,
            insertDelayRequired: insertDelayRequired,
            insertShortageQuantity: insertShortageQuantity
        });
    }

    function openInsertLineRecommendationDialog(candidateLines, requiredInsertLineCount, onConfirm, onCancel, extraInfo) {
        const STANDARD_SHIFT_HOURS_PER_DAY = 18;
        const defaultSelectedIndex = Math.max(requiredInsertLineCount, 0);
        const capacityComputationTrace = [];
        const totalReleasableCapacity = candidateLines.reduce(function (sum, line, idx) {
            const capacity = Number(line && line.releasableCapacity);
            const totalShiftHours = Number(line && line.totalShiftHours);
            const validShiftHours = Number.isFinite(totalShiftHours) ? totalShiftHours : 0;
            const effectiveCapacityPerHour = Number(line && line.effectiveCapacityPerHour);
            const validEffectiveCapacityPerHour = Number.isFinite(effectiveCapacityPerHour) ? effectiveCapacityPerHour : 0;
            const dailyCapacity = Math.floor(validEffectiveCapacityPerHour * STANDARD_SHIFT_HOURS_PER_DAY);
            const dayCount = validShiftHours > 0 ? Math.ceil(validShiftHours / STANDARD_SHIFT_HOURS_PER_DAY) : 0;
            const validCapacity = Number.isFinite(capacity) ? capacity : 0;
            const nextSum = sum + validCapacity;
            const hourAccumulationTrace = [];
            let accumulatedHours = 0;
            for (let dayIndex = 1; dayIndex <= dayCount; dayIndex += 1) {
                const remainingHours = Math.max(validShiftHours - accumulatedHours, 0);
                const dayHours = Math.min(STANDARD_SHIFT_HOURS_PER_DAY, remainingHours);
                accumulatedHours += dayHours;
                hourAccumulationTrace.push({
                    day: dayIndex,
                    dayHours: dayHours,
                    accumulatedHours: accumulatedHours
                });
            }
            capacityComputationTrace.push({
                step: idx + 1,
                lineId: line && line.lineId,
                lineName: line && line.lineName,
                rawReleasableCapacity: line && line.releasableCapacity,
                baseCapacityPerHour: line && line.baseCapacityPerHour,
                runtimeCapacityPerHour: line && line.runtimeCapacityPerHour,
                effectiveCapacityPerHour: line && line.effectiveCapacityPerHour,
                totalShiftHours: line && line.totalShiftHours,
                dailyCapacity: dailyCapacity,
                dayCount: dayCount,
                releasableCapacityFormula: line && line.releasableCapacityFormula,
                normalizedReleasableCapacity: validCapacity,
                cumulativeCapacity: nextSum,
                totalShiftHoursAccumulationTrace: hourAccumulationTrace,
                accumulationTraceNote: '前端按18小时/天拆分的示意轨迹（非后端按日期逐天累加结果）' 
            });
            return nextSum;
        }, 0);
        const requiredInsertQuantity = Number((extraInfo && extraInfo.requiredInsertQuantity) || 0);
        const insertDeadline = (extraInfo && extraInfo.insertDeadline) ? String(extraInfo.insertDeadline) : '-';
        const insertDelayRequired = !!(extraInfo && extraInfo.insertDelayRequired);
        const insertShortageQuantity = Number((extraInfo && extraInfo.insertShortageQuantity) || 0);
        const shortageQuantity = Math.max(requiredInsertQuantity - totalReleasableCapacity, 0);
        const today = new Date();
        const deadlineDate = insertDeadline !== '-' ? new Date(insertDeadline + 'T00:00:00') : null;
        const deadlineDaysFromToday = deadlineDate && !Number.isNaN(deadlineDate.getTime())
            ? Math.ceil((deadlineDate.getTime() - today.setHours(0, 0, 0, 0)) / (24 * 60 * 60 * 1000))
            : null;
        console.group('[插单推荐产线] 缺口与产能计算过程');
        console.log('输入参数', {
            requiredInsertQuantity: requiredInsertQuantity,
            requiredInsertLineCount: requiredInsertLineCount,
            candidateLineCount: candidateLines.length,
            insertDeadline: insertDeadline,
            insertDelayRequired: insertDelayRequired,
            backendShortageQuantity: insertShortageQuantity
        });
        console.table(capacityComputationTrace);
        console.log('totalShiftHours 说明', {
            meaning: '截止到交期前的可排班总工时（小时），由后端基于班次日历按日期区间裁剪后累计得到',
            deadlineDate: insertDeadline,
            deadlineDaysFromToday: deadlineDaysFromToday,
            standardShiftHoursPerDay: STANDARD_SHIFT_HOURS_PER_DAY,
            perLineHourToDayFormula: '示意天数 = ceil(totalShiftHours / 18)（仅用于展示）',
            perLineCapacityFormula: '总产能 = floor(effectiveCapacityPerHour × totalShiftHours)',
            perLineDailyCapacityFormula: '日产能 = floor(effectiveCapacityPerHour × 18)'
        });
        capacityComputationTrace.forEach(function (traceItem) {
            console.log('totalShiftHours 累加过程（前端示意）', {
                lineId: traceItem.lineId,
                lineName: traceItem.lineName,
                totalShiftHours: traceItem.totalShiftHours,
                accumulationTrace: traceItem.totalShiftHoursAccumulationTrace
            });
        });
        console.log('汇总结果', {
            totalReleasableCapacity: totalReleasableCapacity,
            computedShortageQuantity: shortageQuantity,
            shortageComputationFormula: requiredInsertQuantity + ' - ' + totalReleasableCapacity + ' = ' + shortageQuantity,
            backendShortageQuantity: insertShortageQuantity,
            shortageGapWithBackend: shortageQuantity - insertShortageQuantity
        });
        console.groupEnd();

        const riskTagDescriptions = {
            LOW: '可用风险低，可优先用于插单',
            LINE_STOPPED: '产线停机，预计无法释放产能',
            RUNTIME_UNKNOWN: '运行状态未知，需人工确认',
            MODEL_UNKNOWN: '当前型号未知，切换成本不明确',
            NO_CAPACITY: '当前无可释放产能'
        };
        const riskLegend = Object.keys(riskTagDescriptions).map(function (tag) {
            return `<li><span style="display:inline-block;min-width:130px;color:#333;">${tag}</span>${riskTagDescriptions[tag]}</li>`;
        }).join('');
        const rows = candidateLines.map(function (line, idx) {
            const lineId = line.lineId === null || line.lineId === undefined ? '' : String(line.lineId);
            const checked = idx < defaultSelectedIndex ? 'checked' : '';
            const totalCapacity = line.releasableCapacity === null || line.releasableCapacity === undefined ? '-' : line.releasableCapacity;
            const effectiveCapacityPerHour = Number(line && line.effectiveCapacityPerHour);
            const totalShiftHours = Number(line && line.totalShiftHours);
            const dailyCapacity = Number.isFinite(effectiveCapacityPerHour) ? Math.floor(effectiveCapacityPerHour * STANDARD_SHIFT_HOURS_PER_DAY) : '-';
            const dayCount = Number.isFinite(totalShiftHours) ? Math.ceil(totalShiftHours / STANDARD_SHIFT_HOURS_PER_DAY) : '-';
            return `
                <tr>
                    <td><input type="checkbox" class="layui-form-checkbox insert-line-checkbox" data-line-id="${escapeHtml(lineId)}" ${checked}></td>
                    <td>${line.lineName || '-'}</td>
                    <td>${totalCapacity}</td>
                    <td>${dailyCapacity}</td>
                    <td>${dayCount}</td>
                    <td>${line.currentModel || '-'}</td>
                    <td>${idx < defaultSelectedIndex ? '推荐' : ''}</td>
                </tr>
            `;
        }).join('');

        layer.open({
            type: 1,
            title: '插单推荐产线',
            area: ['920px', '520px'],
            maxmin: true,
            btn: ['确定', '取消'],
            content: `
                <div style="padding: 12px; max-height: 430px; overflow: auto;">
                    <div style="margin-bottom: 8px; color: #666;">
                        需至少选择 ${requiredInsertLineCount} 条产线用于插单。系统已默认勾选推荐项，可手动调整。
                    </div>
                    <div style="margin-bottom: 8px; color: #333;">
                        <div>缺口数量：<b>${requiredInsertQuantity}</b></div>
                        <div>系统建议最少插单线数量：<b>${requiredInsertLineCount}</b></div>
                        <div>对应交期：<b>${insertDeadline}</b></div>
                        <div>候选线总产能：<b>${totalReleasableCapacity}</b></div>
                        ${insertDelayRequired
                ? `<div style="color:#d9534f;font-weight:700;">推荐总产线仍不足，插单交货期需要延迟（数量缺口：${insertShortageQuantity}）</div>`
                : ''}
                    </div>

                    <table class="layui-table">
                        <thead>
                            <tr>
                                <th style="width:80px;">选择</th>
                                <th>产线</th>
                                <th>总产能</th>
                                <th>日产能</th>
                                <th>天数</th>
                                <th>当前生产型号</th>
                                <th>是否推荐</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `,
            yes: function(index) {
                const checkedBoxes = Array.from(document.querySelectorAll('.insert-line-checkbox:checked'));
                const selectedIds = checkedBoxes
                    .map(item => Number(item.getAttribute('data-line-id')))
                    .filter(id => Number.isFinite(id) && id > 0);
                if (selectedIds.length < requiredInsertLineCount) {
                    layer.msg(`至少需要选择 ${requiredInsertLineCount} 条产线后才能写入排产`);
                    return;
                }
                selectedInsertLineIdsForCommit = selectedIds;
                insertSelectionConfirmedForPreview = true;
                selectedInsertLineIdsForPreview = selectedIds.slice();
                insertDelayConfirmedForPreview = false;
                if (typeof onConfirm === 'function') {
                    onConfirm(selectedIds);
                }
                layer.close(index);
            },
            btn2: function(index) {
                selectedInsertLineIdsForCommit = [];
                selectedInsertLineIdsForPreview = [];
                insertSelectionConfirmedForPreview = false;
                insertDelayConfirmedForPreview = false;
                if (typeof onCancel === 'function') {
                    onCancel();
                }
            }
        });
    }

    function commitAutoPlan() {
        const events = (previewPlanData && previewPlanData.events) || [];
        if (!events.length) {
            layer.msg('当前没有可写入的预览数据');
            return;
        }
        fetch('/api/shift/plan/commit', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                selectedEvents: events,
                selectedInsertLineIds: Array.isArray(selectedInsertLineIdsForCommit) ? selectedInsertLineIdsForCommit : [],
                insertDelayConfirmed: !!insertDelayConfirmedForPreview
            })
        })
            .then(async res => {
                const responseText = await res.text();
                if (!res.ok) throw new Error(responseText || '写入失败');
                return Number(responseText);
            })
            .then(inserted => {
                if (inserted > 0) {
                    previewPlanData = null;
                    selectedInsertLineIdsForCommit = [];
                    insertDelayConfirmedForPreview = false;
                    layer.msg('自动排产已写入班次排班');
                    return;
                }
                layer.msg('未写入任何排产明细，请检查订单匹配条件或预览数据');
            })
            .catch(err => {
                let message = '写入排产失败';
                if (err && err.message) {
                    try {
                        const parsed = JSON.parse(err.message);
                        if (parsed && parsed.message) {
                            message = parsed.message;
                        }
                    } catch (e) {
                        message = err.message;
                    }
                }
                layer.msg(message);
            });
    }

    document.addEventListener('DOMContentLoaded', function () {
        const now = new Date();
        const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
        const nextMonthStart = new Date(now.getFullYear(), now.getMonth() + 1, 1);
        document.getElementById('planStart').value = toDateValue(monthStart);
        document.getElementById('planEnd').value = toDateValue(nextMonthStart);
        previewAutoPlan();
    });
</script>
</body>
</html>
