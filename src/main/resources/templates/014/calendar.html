<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>生产班次日历</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/static/lib/layui-v2.8.17/css/layui.css" media="all">
    <link href='/static/css/bootstrap-icons.css' rel='stylesheet'>
    <link href='/static/css/bootstrap.min.css' rel='stylesheet'>

    <style>
        #calendar {
            width: 100%;
        }
        #calendar a { color: inherit !important; text-decoration: none !important; }
        .fc .fc-daygrid-day-number {
            font-size: 1.2rem !important;  /* 字体大小，可以按需修改如 18px */
            font-weight: bold !important;  /* 加粗 */
            color: #333 !important;        /* 颜色（防止被 Bootstrap 变蓝） */
            padding: 4px 8px !important;   /* 适当增加内边距让数字更美观 */
            text-decoration: none !important; /* 去除下划线 */
        }
        .fc-event-title, .fc-event-main {
            color: #262527 !important;
        }
        .fc .fc-col-header-cell-cushion {
            font-size: 1.1rem !important;
            font-weight: 800 !important;   /* 更粗的数值 */
            color: #000 !important;
            text-decoration: none !important;
        }
        .fc-daygrid-day-top {
            flex-direction: row !important; /* 默认是 row-reverse，改为 row 让数字靠左或保持美观 */
            padding: 5px !important;
        }

        /* 如果你想让“今天”的数字颜色不一样 */
        .fc-day-today .fc-daygrid-day-number {
            color: #ff5722 !important; /* Layui 经典的橙色 */
            border-bottom: 2px solid #ff5722; /* 下方加个横线强调 */
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div style="display:flex;gap:10px;align-items:center;padding:10px 0 8px 2px;">
        <button class="layui-btn layui-btn-sm" onclick="window.location.href='/autoPlanBrowse'">自动排产页面</button>
        <button class="layui-btn layui-btn-sm layui-btn-normal" onclick="openInsertPlanWizard()">插单排产</button>
    </div>
    <div style="display:flex;gap:16px;align-items:center;padding:0 0 12px 2px;color:#555;">
        <span><i class="layui-icon layui-icon-circle-dot" style="color:#1e9fff;"></i> 班次排班</span>
    </div>
    <div id="calendar"></div>
</div>
<script src="/static/js/http_code.jquery.com_jquery-3.6.0.min.js"></script>
<script src="/static/lib/layui-v2.8.17/layui.js" charset="utf-8"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>
<script>
    let calendar;
    let previewPlanData = null;
    let planBrowseData = null;
    let planOrderStartMap = {};
    let insertPlanPreviewData = null;
    let insertPlanRequestPayload = null;
    // --- 工具函数 ---
    const formatTime = (dateTime) => {
        if (!dateTime) return '';
        const date = new Date(dateTime);
        return date.toTimeString().slice(0, 5); // 快速获取 HH:mm
    };

    function openDayEditor(dateStr) {
        fetch('/api/shift/day?date=' + dateStr)
            .then(res => res.json())
            .then(list => {
                const rowsHtml = list.map((item, index) => buildRowHtml(item, index)).join('');
                layer.open({
                    type: 1,
                    title: '编辑排班 - ' + dateStr,
                    area: ['700px', '420px'],
                    btn: ['确定', '取消'],
                    content: `
                    <div style="padding:15px;">
                        <button class="layui-btn layui-btn-sm" onclick="addRow()">新增班次</button>

                        <table class="layui-table" style="margin-top:10px;">
                            <thead>
                                <tr>
                                    <th>班组</th>
                                    <th style="width:260px;">时间范围</th>
                                    <th style="width:80px;">操作</th>
                                </tr>
                            </thead>
                            <tbody id="shiftTableBody">
                                ${rowsHtml}
                            </tbody>
                        </table>
                    </div>
                `,
                    yes: function (index) {
                        saveDaySchedules(dateStr);
                        layer.close(index);
                    }
                });
            });
    }

    /* 构建一行 */
    function buildRowHtml(item = {}, index = 0) {
        return `
        <tr data-id="${item.scheduleId || ''}">
            <td>
                <input type="text" class="layui-input teamName"
                       value="${item.teamID || ''}"
                       placeholder="班次名称">
            </td>
            <td>
                <div style="display:flex;align-items:center;gap:6px;">
                    <input type="time"
                           class="layui-input startTime"
                           style="width:100px;"
                           value="${formatTime(item.startDateTime)}">

                    <span style="color:#666;">至</span>

                    <input type="time"
                           class="layui-input endTime"
                           style="width:100px;"
                           value="${formatTime(item.endDateTime)}">
                </div>
            </td>
            <td>
                <button class="layui-btn layui-btn-danger layui-btn-xs"
                        onclick="removeRow(this)">删除</button>
            </td>
        </tr>
    `;
    }
    function addRow() {
        const index = document.querySelectorAll('#shiftTableBody tr').length;
        const newRowHtml = buildRowHtml({}, index);
        document.getElementById('shiftTableBody').insertAdjacentHTML('beforeend', newRowHtml);
    }

    function removeRow(btn) {
        layer.confirm('确定要移除这个班次吗？', {icon: 3, title:'提示'}, function(index){
            // 找到当前按钮所在的行并删除
            $(btn).closest('tr').remove();
            layer.close(index);
        });
    }
    function saveDaySchedules(dateStr) {
        const rows = document.querySelectorAll('#shiftTableBody tr');

        let schedules = [];

        rows.forEach(tr => {
            const scheduleId = tr.getAttribute('data-id'); // 获取 ID
            const teamID = tr.querySelector('.teamName').value;
            const startTime = tr.querySelector('.startTime').value;
            const endTime = tr.querySelector('.endTime').value;

            if (!teamID) return; // 空行跳过

            schedules.push({
                scheduleId: scheduleId ? parseInt(scheduleId) : null, // 传给后端
                scheduleDate: dateStr,
                teamID: teamID,
                startTime: startTime,
                endTime: endTime
            });
        });

        console.log('要保存的数据：', schedules);

        fetch('/api/shift/day/save', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(schedules)
        }).then(res => {
            if (!res.ok) throw new Error('保存失败');
            layer.msg('保存成功');
            calendar.refetchEvents(); // 刷新日历
        });
    }



    function getCurrentRange() {
        return {
            start: calendar.view.activeStart.toISOString(),
            end: calendar.view.activeEnd.toISOString()
        };
    }

    function toDateTimeLocalValue(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        return `${year}-${month}-${day}T${hours}:${minutes}`;
    }

    function toDateValue(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function getDefaultPlanStart() {
        const now = new Date();
        const activeStart = new Date(calendar.view.activeStart);
        return now > activeStart ? now : activeStart;
    }

    function buildPlanOrderKey(order) {
        if (!order) return '';
        return [order.customer || '', order.outerInnerRing || '', order.model || ''].join('||');
    }

    function requestAutoPlanBrowseData() {
        const range = getCurrentRange();
        const defaultStart = toDateValue(getDefaultPlanStart());
        return fetch('/api/shift/plan/preview', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                start: defaultStart,
                end: range.end
            })
        })
            .then(res => {
                if (!res.ok) throw new Error('预览失败');
                return res.json();
            })
            .then(data => {
                planBrowseData = data || {events: [], orders: [], dailyOutputs: []};
                const orders = planBrowseData.orders || [];
                const nextMap = {};
                orders.forEach(item => {
                    const key = buildPlanOrderKey(item);
                    if (!nextMap[key]) {
                        nextMap[key] = planOrderStartMap[key] || defaultStart;
                    }
                });
                planOrderStartMap = nextMap;
                return planBrowseData;
            });
    }

    function openPlanBrowseDialog(data) {
        const orders = data.orders || [];
        const orderRows = orders.map(item => {
            const key = buildPlanOrderKey(item);
            const startValue = planOrderStartMap[key] || '';
            const orderIds = Array.isArray(item.orderIds) ? item.orderIds.filter(id => id !== null && id !== undefined && id !== '') : [];
            return `
            <tr data-order-key="${escapeHtml(key)}" data-order-ids="${escapeHtml(JSON.stringify(orderIds))}">
                <td>${item.customer || ''}</td>
                <td>${item.outerInnerRing || ''}</td>
                <td>${item.model || ''}</td>
                <td>${item.earliestDeliveryDate || ''}</td>
                <td>${item.currentInventory || 0}</td>
                <td>${item.orderCount || 0}</td>
                <td>${item.safetyStockQuantity || 0}</td>
                <td>${item.plannedQuantity || item.requiredQuantity || 0}</td>
                <td><input type="date" class="layui-input plan-order-start-input" value="${escapeHtml(startValue)}"></td>
            </tr>
            `;
        }).join('');

        layer.open({
            type: 1,
            title: '自动排产 - 浏览分解',
            area: ['100%', '80%'],
            maxmin: true,
            btn: ['排产', '关闭'],
            content: `
                <div style="padding: 12px; max-height: 650px; overflow: auto;">
                    <div style="margin-bottom: 8px; color: #666;">请为每组订单设置开始时间，再点击“排产”。</div>
                    <div style="margin-bottom: 8px; font-weight: 700;">待排产订单汇总</div>
                    <table class="layui-table">
                        <thead>
                            <tr>
                                <th>客户</th><th>内外圈</th><th>型号</th><th>最早交期</th><th>在库数量</th><th>订单需求数</th><th>安全库存数</th><th>计划排产数</th><th>开始时间</th>
                            </tr>
                        </thead>
                        <tbody>${orderRows || '<tr><td colspan="9" style="text-align:center;color:#999;">无可排产需求</td></tr>'}</tbody>
                    </table>
                </div>
            `,
            yes: function(index) {
                const startRows = document.querySelectorAll('tr[data-order-key]');
                const orderStartTimes = {};
                let invalid = false;
                startRows.forEach(row => {
                    const key = row.getAttribute('data-order-key') || '';
                    const rawOrderIds = row.getAttribute('data-order-ids') || '[]';
                    const start = (row.querySelector('.plan-order-start-input') || {}).value || '';
                    if (!start) {
                        invalid = true;
                        return;
                    }
                    planOrderStartMap[key] = start;
                    try {
                        const orderIds = JSON.parse(rawOrderIds);
                        if (Array.isArray(orderIds)) {
                            orderIds.forEach(orderId => {
                                if (orderId !== null && orderId !== undefined && orderId !== '') {
                                    orderStartTimes[String(orderId)] = start;
                                }
                            });
                        }
                    } catch (e) {
                        // ignore malformed row metadata
                    }
                });
                if (invalid) {
                    layer.msg('请为每条订单汇总填写开始时间');
                    return;
                }
                layer.close(index);
                requestAutoPlanPreviewByOrderStart(orderStartTimes);
            }
        });
    }

    function previewAutoPlan() {
        requestAutoPlanBrowseData()
            .then(data => openPlanBrowseDialog(data))
            .catch(() => layer.msg('自动排产浏览数据加载失败'));
    }

    function requestAutoPlanPreviewByOrderStart(orderStartTimes) {
        const range = getCurrentRange();
        const startList = Object.values(orderStartTimes || {}).filter(Boolean).sort();
        const fallbackStart = startList.length ? startList[0] : toDateValue(getDefaultPlanStart());
        fetch('/api/shift/plan/preview', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                start: fallbackStart,
                end: range.end,
                orderStartTimes: orderStartTimes
            })
        })
            .then(res => {
                if (!res.ok) throw new Error('预览失败');
                return res.json();
            })
            .then(data => {
                previewPlanData = data || {events: [], orders: [], dailyOutputs: []};
                openPlanPreviewDialog(previewPlanData);
            })
            .catch(() => layer.msg('自动排产预览失败'));
    }

    function readListResult(data) {
        if (Array.isArray(data)) return data;
        if (data && Array.isArray(data.data)) return data.data;
        if (data && Array.isArray(data.records)) return data.records;
        if (data && data.data && Array.isArray(data.data.records)) return data.data.records;
        return [];
    }

    function normalizeOrder(item) {
        return {
            orderId: item.id || item.orderId || item.productionOrderId || '',
            orderNo: item.orderNo || item.productionOrderNo || item.code || '',
            customer: item.customer || item.customerName || '',
            model: item.model || item.productModel || '',
            priority: normalizeOrderPriority(item.priority || item.orderPriority || ''),
            status: normalizeOrderStatus(item.status || item.orderStatus || ''),
            dueDate: item.earliestDeliveryDate || item.deliveryDate || item.dueDate || '',
            quantity: item.quantity || item.requiredQuantity || item.planQuantity || 0
        };
    }

    function normalizeOrderStatus(status) {
        const value = String(status || '').trim();
        if (['0', '待排产', 'PENDING', 'UNPLANNED'].includes(value)) return '0';
        if (['1', '已排产', 'PLANNED'].includes(value)) return '1';
        if (['2', '已完成', 'COMPLETED'].includes(value)) return '2';
        return value;
    }

    function normalizeOrderPriority(priority) {
        const value = String(priority || '').trim();
        if (['0', '普通', 'NORMAL'].includes(value)) return '0';
        if (['1', '加急', 'URGENT'].includes(value)) return '1';
        if (['2', '插单', 'INSERT'].includes(value)) return '2';
        return value;
    }

    function renderOrderStatus(status) {
        const normalized = normalizeOrderStatus(status);
        if (normalized === '0') return '待排产';
        if (normalized === '1') return '已排产';
        if (normalized === '2') return '已完成';
        return normalized || '-';
    }

    function renderOrderPriority(priority) {
        const normalized = normalizeOrderPriority(priority);
        if (normalized === '0') return '普通';
        if (normalized === '1') return '加急';
        if (normalized === '2') return '插单';
        return normalized || '-';
    }

    function isInsertCandidate(order) {
        const status = normalizeOrderStatus(order.status);
        const priority = normalizeOrderPriority(order.priority);
        const isPending = status === '0';
        const isPriorityMatched = priority === '1' || priority === '2';
        return isPending && isPriorityMatched;
    }

    function escapeHtml(raw) {
        if (raw === null || raw === undefined) return '';
        return String(raw)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function openInsertPlanWizard() {
        layer.load(1, {shade: 0.15});
        fetch('/production-order/list')
            .then(res => {
                if (!res.ok) throw new Error('拉取插单候选订单失败');
                return res.json();
            })
            .then(data => {
                const candidates = readListResult(data).map(normalizeOrder).filter(isInsertCandidate);
                openInsertOrderSelector(candidates);
            })
            .catch((err) => {
                layer.msg(err && err.message ? err.message : '拉取插单候选订单失败');
            })
            .finally(() => layer.closeAll('loading'));
    }

    function openInsertOrderSelector(candidates) {
        const rows = candidates.map(item => `
            <tr>
                <td><input type="checkbox" class="insert-order-checkbox" value="${escapeHtml(item.orderId)}"></td>
                <td>${escapeHtml(item.orderNo || item.orderId)}</td>
                <td>${escapeHtml(item.customer)}</td>
                <td>${escapeHtml(item.model)}</td>
                <td>${escapeHtml(renderOrderPriority(item.priority))}</td>
                <td>${escapeHtml(renderOrderStatus(item.status))}</td>
                <td>${escapeHtml(item.dueDate)}</td>
                <td>${escapeHtml(item.quantity)}</td>
            </tr>
        `).join('');

        layer.open({
            type: 1,
            title: '插单排产 - 第一步：选择订单',
            area: ['1100px', '680px'],
            maxmin: true,
            btn: ['下一步', '取消'],
            content: `
                <div style="padding: 12px;">
                    <div style="margin-bottom: 8px;color:#666;">
                        仅展示状态=待排产 且 priority=加急/插单 的候选订单，可多选。
                    </div>
                    <table class="layui-table">
                        <thead>
                            <tr>
                                <th>
                                    <input type="checkbox" id="insertOrderCheckAll">
                                    全选
                                </th>
                                <th>订单号</th>
                                <th>客户</th>
                                <th>型号</th>
                                <th>优先级</th>
                                <th>状态</th>
                                <th>交期</th>
                                <th>数量</th>
                            </tr>
                        </thead>
                        <tbody>${rows || '<tr><td colspan="8" style="text-align:center;color:#999;">没有符合条件的候选订单</td></tr>'}</tbody>
                    </table>
                </div>
            `,
            success: function() {
                const checkAll = document.getElementById('insertOrderCheckAll');
                if (checkAll) {
                    checkAll.addEventListener('change', function() {
                        document.querySelectorAll('.insert-order-checkbox').forEach(el => {
                            el.checked = checkAll.checked;
                        });
                    });
                }
            },
            yes: function(index) {
                const selectedIds = Array.from(document.querySelectorAll('.insert-order-checkbox:checked')).map(el => el.value);
                if (!selectedIds.length) {
                    layer.msg('请至少选择一条插单订单');
                    return;
                }
                const selectedOrders = candidates.filter(item => selectedIds.includes(String(item.orderId)));
                layer.close(index);
                openInsertPlanConfig(selectedOrders);
            }
        });
    }

    function fetchMatchedLinesByOrders(selectedOrders) {
        const models = Array.from(new Set((selectedOrders || [])
            .map(item => (item && item.model ? String(item.model).trim() : ''))
            .filter(Boolean)));
        if (!models.length) {
            return Promise.resolve([]);
        }
        return fetch('/api/model-config/matched-lines', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({models: models})
        })
            .then(res => {
                if (!res.ok) throw new Error('拉取可用产线失败');
                return res.json();
            })
            .then(data => readListResult(data));
    }

    function openInsertPlanConfig(selectedOrders) {
        const orderIds = (selectedOrders || []).map(item => Number(item.orderId)).filter(item => !Number.isNaN(item));
        const defaultStart = toDateTimeLocalValue(new Date());
        fetchMatchedLinesByOrders(selectedOrders)
            .then(lineOptions => {
                if (!lineOptions.length) {
                    layer.msg('所选订单型号未匹配到可生产产线，请先维护产线系列配置');
                    return;
                }
                const optionHtml = lineOptions.map(line => `
                    <option value="${escapeHtml(line.id)}"> ${escapeHtml(line.lineName || '')}</option>
                `).join('');
                layer.open({
                    type: 1,
                    title: '插单排产 - 第二步：参数设置',
                    area: ['80%', '60%'],
                    btn: ['预览插单影响', '取消'],
                    content: `
        <style>
            .custom-form .layui-form-label{
                width:120px;
            }
            .custom-form .layui-input-block{
                margin-left:150px;
            }
        </style>

        <!-- ❗必须加 layui-form + custom-form -->
        <div class="layui-form custom-form" style="padding:16px;">

            <div class="layui-form-item">
                <label class="layui-form-label">开始时间</label>
                <div class="layui-input-block">
                    <input id="insertStartTime" type="datetime-local" class="layui-input" value="${defaultStart}">
                </div>
            </div>
<div class="layui-form-item">
    <label class="layui-form-label">作用产线</label>
    <div class="layui-input-block">
        <select id="insertLineIds" class="layui-input" multiple size="8" style="height:auto;min-height:180px;"> ${optionHtml} </select>
        <div style="margin-top:4px;color:#999;">已根据所选订单型号匹配可生产该系列的产线，可多选。</div>
    </div>
 </div>
            <div class="layui-form-item">
                <label class="layui-form-label">作用产线</label>
                <div class="layui-input-block">
                    <!-- ❗去掉 layui-input -->
                    <select id="insertLineIds" multiple size="8" style="width:100%;min-height:180px;">
                        ${optionHtml}
                    </select>
                    <div style="margin-top:4px;color:#999;">
                        已根据所选订单型号匹配可生产该系列的产线，可多选。
                    </div>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">冻结窗(小时)</label>
                <div class="layui-input-block">
                    <input id="insertFreezeHours" type="number" min="0" step="1" class="layui-input" value="24">
                </div>
            </div>

        </div>`,
                    yes: function(index) {
                        const startTime = (document.getElementById('insertStartTime') || {}).value;
                        const lineSelect = document.getElementById('insertLineIds');
                        const freezeWindowHours = Number((document.getElementById('insertFreezeHours') || {}).value || 0);
                        if (!startTime) {
                            layer.msg('请选择开始时间');
                            return;
                        }
                        const selectedLineIds = Array.from((lineSelect && lineSelect.selectedOptions) || [])
                            .map(item => Number(item.value))
                            .filter(item => !Number.isNaN(item));
                        if (!selectedLineIds.length) {
                            layer.msg('请至少选择一条作用产线');
                            return;
                        }
                        if (Number.isNaN(freezeWindowHours) || freezeWindowHours < 0) {
                            layer.msg('冻结窗必须是大于等于0的整数');
                            return;
                        }
                        insertPlanRequestPayload = {
                            planMode: 'INSERT',
                            insertOrderIds: orderIds,
                            start: startTime,
                            end: getCurrentRange().end,
                            lineIds: selectedLineIds,
                            lineScope: 'PARTIAL',
                            freezeHours: freezeWindowHours
                        };
                        layer.close(index);
                        requestInsertPlanPreview();
                    }
                });
            })
            .catch(err => layer.msg((err && err.message) || '拉取可用产线失败'));
    }

    function getInsertPreviewSection(data, keys) {
        for (let i = 0; i < keys.length; i++) {
            const value = data ? data[keys[i]] : null;
            if (Array.isArray(value)) return value;
        }
        return [];
    }

    function requestInsertPlanPreview() {
        if (!insertPlanRequestPayload) {
            layer.msg('插单请求参数缺失');
            return;
        }
        fetch('/api/shift/plan/preview', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(insertPlanRequestPayload)
        })
            .then(res => {
                if (!res.ok) throw new Error('插单排产预览失败');
                return res.json();
            })
            .then(data => {
                insertPlanPreviewData = data || {};
                openInsertPreviewDialog(insertPlanPreviewData);
            })
            .catch(err => layer.msg((err && err.message) || '插单排产预览失败'));
    }

    function openInsertPreviewDialog(data) {
        const insertedOrders = getInsertPreviewSection(data, ['insertOrders', 'insertOrderAchieves', 'insertAchievements', 'orders']);
        const impactedOrders = getInsertPreviewSection(data, ['impactedOrders', 'affectedOrders', 'normalOrderImpacts']);

        const insertedRows = insertedOrders.map(item => `
            <tr>
                <td>${escapeHtml(item.orderNo || item.productionOrderNo || item.orderId || '')}</td>
                <td>${escapeHtml(item.customer || item.customerName || '')}</td>
                <td>${escapeHtml(item.model || item.productModel || '')}</td>
                <td>${escapeHtml(item.requiredQuantity || item.quantity || 0)}</td>
                <td>${escapeHtml(item.plannedQuantity || item.achievedQuantity || 0)}</td>
                <td>${escapeHtml(item.achievementRate || item.reachRate || '')}</td>
            </tr>
        `).join('');

        const impactedRows = impactedOrders.map(item => `
            <tr>
                <td>${escapeHtml(item.orderNo || item.productionOrderNo || item.orderId || '')}</td>
                <td>${escapeHtml(item.customer || item.customerName || '')}</td>
                <td>${escapeHtml(item.model || item.productModel || '')}</td>
                <td>${escapeHtml(item.delayQuantity || item.deferredQuantity || 0)}</td>
                <td>${escapeHtml(item.delayDays || item.deferredDays || 0)}</td>
            </tr>
        `).join('');

        layer.open({
            type: 1,
            title: '插单排产预览（INSERT）',
            area: ['100%', '82%'],
            maxmin: true,
            btn: ['确认写入', '关闭'],
            content: `
                <div style="padding: 12px; max-height: 650px; overflow: auto;">
                    <div style="font-weight:700;margin-bottom:8px;">插单订单达成情况</div>
                    <table class="layui-table">
                        <thead>
                            <tr>
                                <th>订单</th><th>客户</th><th>型号</th><th>需求数量</th><th>计划数量</th><th>达成率</th>
                            </tr>
                        </thead>
                        <tbody>${insertedRows || '<tr><td colspan="6" style="text-align:center;color:#999;">无插单达成数据</td></tr>'}</tbody>
                    </table>

                    <div style="font-weight:700;margin:14px 0 8px;">被影响普通订单（延后数量/天数）</div>
                    <table class="layui-table">
                        <thead>
                            <tr>
                                <th>订单</th><th>客户</th><th>型号</th><th>延后数量</th><th>延后天数</th>
                            </tr>
                        </thead>
                        <tbody>${impactedRows || '<tr><td colspan="5" style="text-align:center;color:#999;">无普通订单影响数据</td></tr>'}</tbody>
                    </table>
                </div>
            `,
            yes: function(index) {
                commitInsertPlan();
                layer.close(index);
            }
        });
    }

    function commitInsertPlan() {
        if (!insertPlanPreviewData) {
            layer.msg('当前没有可提交的插单预览数据');
            return;
        }
        fetch('/api/shift/plan/commit-insert', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                request: insertPlanRequestPayload,
                preview: insertPlanPreviewData
            })
        })
            .then(async res => {
                const text = await res.text();
                if (!res.ok) throw new Error(text || '插单提交失败');
                return text;
            })
            .then(() => {
                insertPlanPreviewData = null;
                insertPlanRequestPayload = null;
                calendar.getEventSourceById('shiftScheduleSource').refetch();
                layer.msg('插单排产已写入');
            })
            .catch(err => layer.msg((err && err.message) || '插单提交失败'));
    }

    function formatMetricValue(value) {
        if (value === null || value === undefined || value === '') return '-';
        const num = Number(value);
        if (!Number.isFinite(num)) return '-';
        return num.toFixed(2);
    }

    function formatRangeDate(dateTime) {
        if (!dateTime) return '';
        return dateTime.slice(0, 10);
    }

    function resolvePlanRangeText(data, events) {
        const planStart = data && data.planStart ? String(data.planStart) : '';
        const planEnd = data && data.planEnd ? String(data.planEnd) : '';
        if (planStart && planEnd) {
            return `${planStart} ~ ${planEnd}`;
        }
        if (planStart) {
            return planStart;
        }
        if (planEnd) {
            return planEnd;
        }
        if (!events || !events.length) {
            return '';
        }
        const starts = events.map(item => item && item.start).filter(Boolean).sort();
        const ends = events.map(item => item && item.end).filter(Boolean).sort();
        if (!starts.length && !ends.length) {
            return '';
        }
        const fallbackStart = starts.length ? starts[0] : '';
        const fallbackEnd = ends.length ? ends[ends.length - 1] : '';
        if (fallbackStart && fallbackEnd) {
            return `${fallbackStart} ~ ${fallbackEnd}`;
        }
        return fallbackStart || fallbackEnd;
    }

    function openPlanPreviewDialog(data) {
        const orders = data.orders || [];
        const events = data.events || [];
        const planRangeText = resolvePlanRangeText(data, events);

        const orderRows = orders.map(item => `
            <tr>
                <td>${item.customer || ''}</td>
                <td>${item.outerInnerRing || ''}</td>
                <td>${item.model || ''}</td>
                <td>${item.earliestDeliveryDate || ''}</td>
                <td>${item.currentInventory || 0}</td>
                <td>${item.orderCount || 0}</td>
                <td>${item.safetyStockQuantity || 0}</td>
                <td>${item.plannedQuantity || item.requiredQuantity || 0}</td>
            </tr>
        `).join('');
        // <td>${item.plannedQuantity || 0}</td>

        const resultRows = events.map(event => {
            const diagnosticTag = event.metricDiagnosticTag || '';
            const diagnosticNote = diagnosticTag && diagnosticTag !== 'OK' ? `（${diagnosticTag}）` : '';
            const plannedDays = Number(event.plannedDays || 0);
            return `
                <tr>
                    <td>${event.lineName || ''}</td>
                    <td>${event.customer || ''}</td>
                    <td>${event.outerInnerRing || ''}</td>
                    <td>${event.model || ''}</td>
                    <td>${formatRangeDate(event.start)} ~ ${formatRangeDate(event.end)}</td>
                    <td>${plannedDays > 0 ? plannedDays : '-'}</td>
                    <td>${formatMetricValue(event.dailyOutput)}${diagnosticNote}</td>
                    <td>${formatMetricValue(event.avgDailyWorkHours)}</td>
                    <td>${formatMetricValue(event.capacityPerHour)}</td>
                    <td>${event.quantity || 0}</td>
                </tr>
            `;
        }).join('');

        layer.open({
            type: 1,
            title: '自动排产结果预览',
            area: ['100%', '80%'],
            maxmin: true,
            btn: ['写入排产', '关闭'],
            content: `
                <div style="padding: 12px; max-height: 650px; overflow: auto;">
                    <div style="margin-bottom: 8px; color: #666;">计划起止：${planRangeText || '-'}</div>
                    <div style="margin-bottom: 8px; font-weight: 700;">待排产订单汇总</div>
                    <table class="layui-table">
                        <thead>
                            <tr>
                                <th>客户</th><th>内外圈</th><th>型号</th><th>最早交期</th><th>在库数量</th><th>订单需求数</th><th>安全库存数</th><th>计划排产数</th>
                            </tr>
                        </thead>
                        <tbody>${orderRows || '<tr><td colspan="8" style="text-align:center;color:#999;">无可排产需求</td></tr>'}</tbody>
                    </table>

                    <div style="margin: 14px 0 8px; font-weight: 700;">排产结果</div>
                    <table class="layui-table">
                        <thead>
                            <tr>
                                <th>产线</th><th>客户</th><th>内外圈</th><th>型号</th><th>排产时间范围</th><th>天数</th><th>日产量</th><th>日均工时</th><th>产能(件/小时)</th><th>总产量</th>
                            </tr>
                        </thead>
                        <tbody>${resultRows || '<tr><td colspan="10" style="text-align:center;color:#999;">暂无排产结果</td></tr>'}</tbody>
                    </table>
                </div>
            `,
            yes: function(index) {
                layer.confirm('确认将当前排产结果写入班次排班吗？', {icon: 3, title: '确认写入'}, function(confirmIndex){
                    commitAutoPlan();
                    layer.close(confirmIndex);
                    layer.close(index);
                });
            }
        });
    }

    function commitAutoPlan() {
        const events = (previewPlanData && previewPlanData.events) || [];
        if (!events.length) {
            layer.msg('当前没有可写入的预览数据');
            return;
        }
        fetch('/api/shift/plan/commit', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(events)
        })
            .then(async res => {
                const responseText = await res.text();
                if (!res.ok) {
                    throw new Error(responseText || '写入失败');
                }
                return Number(responseText);
            })
            .then(inserted => {
                if (inserted > 0) {
                    previewPlanData = null;
                    calendar.getEventSourceById('shiftScheduleSource').refetch();
                    layer.msg('自动排产已写入班次排班');
                    return;
                }
                layer.msg('未写入任何排产明细，请检查订单匹配条件或预览数据');
            })
            .catch(err => {
                let message = '写入排产失败';
                if (err && err.message) {
                    try {
                        const parsed = JSON.parse(err.message);
                        if (parsed && parsed.message) {
                            message = parsed.message;
                        }
                    } catch (e) {
                        message = err.message;
                    }
                }
                layer.msg(message);
            });
    }

    document.addEventListener('DOMContentLoaded', function () {
        var calendarEl = document.getElementById('calendar');

        calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'zh-cn',
            displayEventTime: false,
            buttonText: {today:    '今天', month:    '月', week:     '周', day:      '日', list:     '日程列表'},
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay,list'
            },
            height: 950,
            selectable: true,
            editable: false,

            eventSources: [
                {
                    id: 'shiftScheduleSource',
                    events: function(fetchInfo, successCallback, failureCallback) {
                        fetch('/api/shift/events?start=' + fetchInfo.startStr + '&end=' + fetchInfo.endStr)
                            .then(res => res.json())
                            .then(data => successCallback(data.map(item => ({...item, sourceType: 'shift'}))))
                            .catch(err => failureCallback(err));
                    }
                }
            ],

            dayCellContent: function (arg) {
                const d = arg.date;
                const dateStr =
                    d.getFullYear() + '-' +
                    String(d.getMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getDate()).padStart(2, '0');
                const today = new Date();
                today.setHours(0, 0, 0, 0); // 清零时间
                const cellDate = new Date(d);
                cellDate.setHours(0, 0, 0, 0);
                const canEdit = cellDate >= today;

                return {
                    html: `
            <div style="display:flex;align-items:center;gap:4px;">
                <span>${arg.dayNumberText}</span>
                ${
                        canEdit
                            ? `<i class="layui-icon layui-icon-edit"
                               style="cursor:pointer;color:#1E9FFF;"
                               onclick="openDayEditor('${dateStr}')"></i>`
                            : ''
                    }
            </div>
        `
                };
            },
            eventDataTransform: function(event) {
                var sTime = event.shiftStartTime || '';
                var eTime = event.shiftEndTime || '';
                const isPlanEvent = (event.title || '').startsWith('[排产]');
                // 2. 重新组合标题： 一班 (08:00:00~17:00:00)
                if (!isPlanEvent && sTime && eTime) {
                    // 显示小时分钟，用 sTime.substring(0, 5)
                    event.title = event.title + " (" + sTime + "~" + eTime + ")";
                }

                return event;
            },

            // eventClick: function(info) {
            //     alert(
            //         '班组：' + info.event.title + '\n' +
            //         '开始：' + info.event.startStr + '\n' +
            //         '结束：' + info.event.endStr
            //     );
            // },


        });

        // calendar.addEvent({
        //     title: '6202',
        //     start: '2025-12-20',
        //     end: '2025-12-31',
        //     allDay: true
        // });

        calendar.render();
    });
</script>
